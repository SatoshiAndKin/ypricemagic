[build-system]
requires = [
  "setuptools",
  "wheel",
  "mypy[mypyc] @ git+https://github.com/SatoshiAndKin/mypy.git@18a37e099bba69872e38adaee3319c125c97048e",
  "pony-stubs==0.5.2",
  "types-python-dateutil",
  "types-cachetools",
  "types-requests",
  "types-PyYAML==6.0.12.20260906",
  "aiosqlite @ git+https://github.com/SatoshiAndKin/aiosqlite.git@b8265cce6f09bcc8015ea09036f5e05c4546d740",
  "bobs_lazy_logging==0.0.5",
  "dank-mids @ git+https://github.com/SatoshiAndKin/dank_mids.git@9a58cd91b4a652ac10d41cc5862c7b2770727632 ; platform_system == 'MacOS' or (platform_system == 'Linux' and platform_machine != 'i686')",
  "eth-brownie @ git+https://github.com/SatoshiAndKin/brownie.git@c986066ddd9ae10906a470008d786faab2355cc5 ; platform_system == 'Linux' and platform_machine != 'i686'",
  "eth-retry==0.3.7",
  "eth-typing==5.2.1",
  "ez-a-sync @ git+https://github.com/SatoshiAndKin/ez-a-sync.git@ed3459ee74abec91c7675f57fee4b75595edbfdc",
  "faster-eth-abi>=5.2.12,<6",
  "faster-hexbytes==1.3.4",
  "typed-envs==0.2.4",
  "cachebox @ git+https://github.com/SatoshiAndKin/cachebox.git@10be25afe46afb32c8135db4d1b8e2d94431b9c1",
]

[tool.mypy]
plugins = ["typed_envs.mypy_plugin", "a_sync_mypy_plugin"]
files = ["y", "tests", "tools/validation"]
exclude = ["^build/", "^cache/", "^env/", "^[.]worktrees/"]
strict = true
pretty = true
show_error_codes = true
show_error_context = true
incremental = false
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["y._db.brownie", "y._db.config", "y._db.decorators", "y._db.utils.stringify", "y.ENVIRONMENT_VARIABLES", "y.convert", "y.exceptions", "y.networks", "y.prices.utils.sense_check", "y.utils.gather"]
disable_error_code = ["import-not-found", "no-untyped-def", "no-untyped-call", "unused-ignore"]

[tool.mypyc]
files = ["y/_db/brownie.py", "y/_db/config.py", "y/_db/decorators.py", "y/_db/utils/stringify.py", "y/ENVIRONMENT_VARIABLES.py", "y/convert.py", "y/exceptions.py", "y/networks.py", "y/prices/utils/sense_check.py", "y/utils/gather.py"]

[tool.pytest.ini_options]
addopts = "-W ignore -s -p no:pytest_ethereum"
required_plugins = ["pytest-timeout"]
testpaths = ["tests"]
norecursedirs = ["env", "build", "cache", ".worktrees"]
timeout = 600
asyncio_task_timeout = 600

[tool.black]
line-length = 100

[tool.validation]
memory_tests = ["tests/prices/dex/test_uniswap.py"]
topic_tests = ["tests/test_topic_memory.py"]
fixture_tests = ["tests/prices/dex/test_uniswap.py::test_uniswap_v1"]
focused_tests = [
  "tests/test_topic_memory.py",
  "tests/test_pool_memory.py",
  "tests/test_bulk_memory.py",
  "tests/test_event_memory.py",
  "tests/prices/test_gearbox.py",
  "tests/prices/test_magic.py::test_bulk_fixture_releases_mapped_requests",
  "tests/test_memory_release.py",
  "tests/test_dank_import_guard.py",
  "tests/test_pricing_correctness.py",
  "tests/test_amount_quotes.py",
  "tests/test_quote_regressions.py",
  "tests/test_price_result.py",
  "tests/test_trade_path_sources.py",
  "tests/test_audit_prices.py",
  "tests/test_cli_logging.py",
  "tests/test_routing_scaling.py",
  "tests/test_cachebox.py",
]
