name: CodeQL

on:
  push:
    branches: [master, dev]
    paths:
      - "**.py"
      - ".github/workflows/codeql-analysis.yml"
      - ".github/workflows/codeql-reviewed-linux.yml"
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: "41 4 * * 2"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: SatoshiAndKin/ypricemagic/.github/workflows/codeql-reviewed-linux.yml@7d667685660eb0b3de543d06137ed29a624ac421
