name: Build Documentation

on:
  push:
    branches: [master]
    paths:
      [
        "docs/**",
        "y/**/*.py",
        "Makefile",
        "pyproject.toml",
        "uv.lock",
        ".github/workflows/deploy-docs.yml",
      ]
  pull_request:
    branches: [master]
    paths:
      [
        "docs/**",
        "y/**/*.py",
        "Makefile",
        "pyproject.toml",
        "uv.lock",
        ".github/workflows/deploy-docs.yml",
      ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: docs/requirements.lock
      - name: Create documentation environment
        run: uv venv --python 3.12
      - name: Install only documentation dependencies
        run: uv pip install --python .venv/bin/python --require-hashes -r docs/requirements.lock
      - name: Build documentation from source
        run: make docs
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/_build/html
