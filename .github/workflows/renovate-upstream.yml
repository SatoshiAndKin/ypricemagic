name: Weekly upstream Renovate

on:
  schedule:
    - cron: "15 17 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: renovate-upstream

jobs:
  renovate:
    if: github.repository == 'SatoshiAndKin/ypricemagic'
    permissions:
      contents: write
      issues: read
      pull-requests: write
    uses: SatoshiAndKin/ypricemagic/.github/workflows/renovate-upstream-reviewed-linux.yml@33150291f0d8585c39fcb1e330cd11d9bc704af7
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
