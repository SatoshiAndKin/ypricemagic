name: MyPy

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/mypy.yaml'
      - 'pyproject.toml'
      - 'setup.py'
      - 'requirements.txt'
      
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mypy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        pyversion: [ "3.11", "3.12", "3.13" ]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        
    - name: Setup Python (faster than using Python container)
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pyversion }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Cache .mypy_cache
      uses: actions/cache@v5
      with:
        path: .mypy_cache
        key: mypy-cache-${{ runner.os }}-${{ matrix.pyversion }}-${{ hashFiles('**/*.py', 'pyproject.toml') }}

    - name: Install build and runtime dependencies
      shell: python
      run: |
        import subprocess
        import sys
        import tomllib
        from pathlib import Path

        config = tomllib.loads(Path("pyproject.toml").read_text())
        subprocess.run([sys.executable, "-m", "pip", "install", "--upgrade", "pip"], check=True)
        subprocess.run(
            [sys.executable, "-m", "pip", "install", "-r", "requirements.txt", *config["build-system"]["requires"]],
            check=True,
        )

    - name: Run MyPy
      run: mypy
